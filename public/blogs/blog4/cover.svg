<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="18%" r="58%">
      <stop offset="0%" stop-color="#FFD43B" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="92%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#000000"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- left: wordmark -->
  <g transform="translate(96 268)">
    <text x="0" y="0" fill="#FFD43B" font-size="22" font-weight="700" letter-spacing="7">// AI SEO</text>
    <text x="-4" y="104" fill="#FFFFFF" font-size="96" font-weight="700" letter-spacing="-3">Optimize for</text>
    <text x="-4" y="206" fill="#FFD43B" font-size="96" font-weight="700" letter-spacing="-3">the answer.</text>
    <rect x="0" y="258" width="104" height="4" fill="#FFD43B"/>
    <text x="0" y="316" fill="#A1A1A1" font-size="25" letter-spacing="0.4">Content built to be found, understood</text>
    <text x="0" y="352" fill="#A1A1A1" font-size="25" letter-spacing="0.4">and quoted by AI search.</text>
  </g>

  <!-- right: prompt to answer -->
  <g transform="translate(900 214)">
    <rect x="0" y="0" width="600" height="78" rx="39" fill="#0C0C0C" stroke="#FFD43B" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="44" cy="39" r="9" fill="#FFD43B"/>
    <text x="74" y="48" fill="#E8E8E8" font-size="23">Which agency should I work with?</text>

    <path d="M300 94 V140" stroke="#FFD43B" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M292 132 l8 12 8-12" fill="none" stroke="#FFD43B" stroke-opacity="0.55" stroke-width="2"/>

    <rect x="0" y="158" width="600" height="318" rx="26" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="34" y="206" fill="#555555" font-size="16" font-weight="700" letter-spacing="4">AI ANSWER</text>

    <rect x="34" y="230" width="500" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="34" y="260" width="446" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.26"/>

    <rect x="34" y="296" width="212" height="46" rx="23" fill="#FFD43B"/>
    <text x="58" y="326" fill="#000000" font-size="21" font-weight="700">allsoll.com</text>
    <text x="266" y="326" fill="#FFD43B" font-size="19" font-weight="700">cited in the answer</text>

    <rect x="34" y="368" width="532" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="34" y="398" width="330" height="13" rx="6.5" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="34" y="438" width="532" height="1" fill="#FFFFFF" fill-opacity="0.10"/>
  </g>

  <!-- platform chips -->
  <g transform="translate(900 724)" font-size="18" font-weight="700" letter-spacing="1.6">
    <rect x="0" y="0" width="134" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="24" y="29" fill="#BDBDBD">ChatGPT</text>
    <rect x="150" y="0" width="186" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="174" y="29" fill="#BDBDBD">AI Overviews</text>
    <rect x="352" y="0" width="118" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="376" y="29" fill="#BDBDBD">Gemini</text>
    <rect x="486" y="0" width="150" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="510" y="29" fill="#BDBDBD">Perplexity</text>
  </g>
</svg>
